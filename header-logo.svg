<svg width="720" height="220" viewBox="0 0 720 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="SKF graffiti logo inside a football">
  <defs>
    <linearGradient id="ballGlow" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f9fafb"/>
      <stop offset="1" stop-color="#dfe7ef"/>
    </linearGradient>
    <linearGradient id="goldOutline" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fbe7a0"/>
      <stop offset="1" stop-color="#d4a52a"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#06131f" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="720" height="220" fill="none"/>

  <g filter="url(#shadow)" transform="translate(16 10)">
    <circle cx="100" cy="100" r="94" fill="url(#ballGlow)" stroke="#0f172a" stroke-width="10"/>
    <circle cx="100" cy="100" r="75" fill="none" stroke="#0f172a" stroke-width="3" opacity="0.8"/>

    <path d="M100 54 L114 77 L100 100 L86 77 Z" fill="#0f172a"/>
    <path d="M78 86 L100 100 L82 120 L60 104 Z" fill="#0f172a"/>
    <path d="M122 86 L100 100 L118 120 L140 104 Z" fill="#0f172a"/>
    <path d="M65 118 L86 107 L100 130 L80 149 Z" fill="#0f172a"/>
    <path d="M135 118 L114 107 L100 130 L120 149 Z" fill="#0f172a"/>
    <path d="M100 100 L114 77 L140 91 L127 122 L100 130 L73 122 L60 91 L86 77 Z" fill="none" stroke="#0f172a" stroke-width="4" opacity="0.8"/>

    <g transform="translate(0 4)">
      <text
        x="100"
        y="112"
        text-anchor="middle"
        font-size="78"
        font-weight="900"
        line-height="1"
        letter-spacing="1"
        fill="#0a1322"
        stroke="url(#goldOutline)"
        stroke-width="6"
        paint-order="stroke fill"
        transform="rotate(-7 100 112)"
        font-family="Segoe Print, Marker Felt, 'Comic Sans MS', 'Bradley Hand', cursive"
      >SKF</text>
    </g>
  </g>

  <g transform="translate(228 40)">
    <text x="0" y="64" fill="#0f172a" font-size="52" font-weight="900" letter-spacing="5" font-family="Impact, Haettenschweiler, 'Arial Black', sans-serif">SPORT</text>
    <text x="0" y="112" fill="#d4a52a" font-size="52" font-weight="900" letter-spacing="5" font-family="Impact, Haettenschweiler, 'Arial Black', sans-serif">FOOTBALL</text>
    <path d="M0 132H255" stroke="#d4a52a" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
